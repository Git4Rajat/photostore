name: Publish public container images

# Builds the backend and frontend container images and publishes them to the
# GitHub Container Registry (ghcr.io) as PUBLIC images. These images are what
# the "Deploy to Azure" button / ARM + Bicep templates pull from, so a deployer
# never has to build anything themselves.
#
# The cluster worker reuses the core image (it only differs by APP_ROLE=cluster),
# so that's still just photostore-backend. The vision role (server-side OCR/face/
# vision/geo -- see backend/ipwork_*.py) gets its own image,
# photostore-ipworker, because it needs torch/open_clip/onnxruntime/opencv/
# mediapipe/tesseract -- multiple GB that would slow every core/cluster
# cold start if bundled into their shared image instead.
#
# ADMIN-ONLY BY DESIGN
# --------------------
# 1. This workflow is `workflow_dispatch` only. The "Run workflow" button is
#    visible/usable solely to users with write access to the repo, so forkers
#    and drive-by contributors can never start it.
# 2. The job runs in the `publish` Environment, which you must configure in the
#    repo UI (Settings -> Environments -> publish) with "Required reviewers" set
#    to the repo admins. Even a write-access user who clicks Run will pause for
#    an admin approval before anything is pushed.
# 3. An explicit actor allowlist (`if:` below) is a cheap extra guard.
#
# ONE-TIME MANUAL STEP: after the first successful run, set each package's
# visibility to Public (Packages -> photostore-backend / -frontend -> Package
# settings -> Change visibility), or the public Azure deploy can't pull them.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Additional image tag to publish alongside :latest and the auto date-time tag (optional)'
        required: false
        default: ''
      publish_latest:
        description: 'Update the shared :latest tags (disable for sandbox branch deployments)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate 1: only listed admins may trigger a real run. Adjust the list to your
    # repo admins. This is belt-and-suspenders on top of the `publish`
    # Environment's required-reviewers approval gate.
    if: contains(fromJSON('["Git4Rajat"]'), github.actor)
    # Gate 2: Environment with required reviewers -> pauses for admin approval.
    environment: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
            lfs: false
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            # Frontend build bundles the face model stored in Git LFS.
            # TEMPORARY (2026-08-12): the repo's Git LFS budget is exceeded,
            # which makes checkout itself fail when lfs:true tries to fetch.
            # Set to false and let frontend/Dockerfile curl the real weights
            # from a GitHub Release mirror instead. Revert to true once the
            # LFS budget resets (and undo the matching Dockerfile change).
            lfs: false
          - name: ipworker
            # Repo root, not backend/ -- ipworker.Dockerfile also bundles
            # frontend/public/models/browser-ai's onnx weights, which live
            # outside a backend/-scoped build context.
            context: .
            dockerfile: backend/ipworker.Dockerfile
            # Bundles the same LFS-tracked onnx weights as the frontend build.
            # TEMPORARY (2026-08-12): same Git LFS budget issue as above --
            # see backend/ipworker.Dockerfile for the curl-based workaround.
            lfs: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: ${{ matrix.lfs }}

      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # A sortable, human-readable, IMMUTABLE tag. Unlike :latest, deploying
      # with this tag means an existing revision keeps pulling this exact
      # image forever (including on scale-to-zero cold-start restarts) —
      # it never silently drifts to whatever :latest happens to be later.
      - name: Compute date-time tag
        id: ts
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      # Use the buildkit container driver; the default docker driver can fail the
      # push to GHCR with "unknown blob".
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # GHCR on some personal accounts refuses to let the auto GITHUB_TOKEN
      # *create* a brand-new package (denied: write_package). Authenticate with
      # a classic PAT (scopes: write:packages, read:packages, delete:packages)
      # stored as the GHCR_PAT secret; fall back to GITHUB_TOKEN if unset.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          platforms: linux/amd64
          tags: |
            ${{ inputs.publish_latest && format('ghcr.io/{0}/photostore-{1}:latest', steps.owner.outputs.owner, matrix.name) || '' }}
            ghcr.io/${{ steps.owner.outputs.owner }}/photostore-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/photostore-${{ matrix.name }}:${{ steps.ts.outputs.tag }}
            ${{ inputs.tag != '' && format('ghcr.io/{0}/photostore-{1}:{2}', steps.owner.outputs.owner, matrix.name, inputs.tag) || '' }}

      - name: Record immutable release image
        env:
          RELEASE_IMAGE: ghcr.io/${{ steps.owner.outputs.owner }}/photostore-${{ matrix.name }}@${{ steps.image.outputs.digest }}
          RELEASE_NAME: ${{ matrix.name }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('release-images').mkdir(exist_ok=True)
          name = os.environ['RELEASE_NAME']
          Path('release-images', name + '.json').write_text(json.dumps(dict(
              name=name, image=os.environ['RELEASE_IMAGE'], sourceCommit=os.environ['RELEASE_SOURCE'])))
          PYTHON

      - uses: actions/upload-artifact@v4
        with:
          name: wave-image-${{ matrix.name }}
          path: release-images/*.json

      - name: Summary
        run: |
          echo "### photostore-${{ matrix.name }} published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/${{ steps.owner.outputs.owner }}/photostore-${{ matrix.name }}:${{ steps.ts.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "After all image jobs and wave qualification pass, download the wave-release artifact." >> "$GITHUB_STEP_SUMMARY"
          echo "Fresh deployment: see deploy/fresh-wave.md. Do not activate waves with a blank capability ID." >> "$GITHUB_STEP_SUMMARY"

  wave-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          pattern: wave-image-*
          path: release-images
          merge-multiple: true
      - name: Qualify wave code in the exact backend image
        run: |
          BACKEND_IMAGE=$(python3 -c "import json; print(json.load(open('release-images/backend.json'))['image'])")
          docker pull "$BACKEND_IMAGE"
          docker run --rm --entrypoint sh \
            -v "$PWD/backend/tests:/app/tests:ro" \
            -v "$PWD/backend/scripts:/app/scripts:ro" \
            -v "$PWD/deploy:/deploy:ro" \
            "$BACKEND_IMAGE" -c 'python -m pytest tests/test_wave*.py tests/test_upload_wave*.py tests/test_fresh_wave*.py -q'
      - name: Create tested release contract
        run: python3 deploy/wave_release.py --image-dir release-images --source "${{ github.sha }}" --output wave-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: wave-release
          path: wave-release.json
      - name: Deployment instructions
        run: |
          echo "Download wave-release.json and follow deploy/fresh-wave.md for a new sandbox." >> "$GITHUB_STEP_SUMMARY"
          echo "The artifact binds all three immutable images and the exact wave capability ID." >> "$GITHUB_STEP_SUMMARY"
