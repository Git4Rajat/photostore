name: Publish benchmark overlay images
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Unique benchmark image tag (does not update latest)
        required: true
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: contains(fromJSON('["Git4Rajat"]'), github.actor)
    environment: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: deploy/benchmark/Dockerfile.runtime
            base: ghcr.io/git4rajat/photostore-backend@sha256:762f814c90bc4c01e2bca02bb11adae783c9f663f75935e7da669c5910364d49
          - name: ipworker
            dockerfile: deploy/benchmark/Dockerfile.runtime
            base: ghcr.io/git4rajat/photostore-ipworker@sha256:4cf28c370bc32e549e346c2c6a2f4cb02ddb1d69e82135c1e60742a200802079
          - name: frontend
            dockerfile: deploy/benchmark/Dockerfile.web
            base: unused
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: BASE_IMAGE=${{ matrix.base }}
          push: true
          provenance: false
          tags: ghcr.io/git4rajat/photostore-${{ matrix.name }}:${{ inputs.tag }}
