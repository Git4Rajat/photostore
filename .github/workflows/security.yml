name: Security checks

# Dependency vulnerability audits. Read-only; never publishes anything.
# Dependabot (.github/dependabot.yml) opens the update PRs. Static analysis is
# CodeQL's repository "default setup" (Settings -> Code security); a CodeQL job
# here would be rejected while that is enabled.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: pip install pip-audit==2.9.0
      - run: pip-audit --no-deps --disable-pip -r backend/requirements.txt
      - run: pip-audit --no-deps --disable-pip -r backend/requirements-ipworker.txt

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - working-directory: frontend
        run: npm audit --audit-level=high
