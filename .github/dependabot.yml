version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: weekly}
    # The pinned ML/numeric wheels (onnxruntime, numpy, scipy) lag new Python minors; 3.15 broke the image
    # build. Move the interpreter by hand once the hash-locked requirements install on it.
    ignore:
      - dependency-name: "*python*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /frontend
    schedule: {interval: weekly}
