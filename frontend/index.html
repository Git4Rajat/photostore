<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e6ae1" />
    <meta name="description" content="Keepsake — your own private photo library. Your memories stay yours." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keepsake" />
    <meta property="og:title" content="Keepsake — your own private photo library" />
    <meta property="og:description" content="Your memories stay yours. A private, self-hosted photo library with on-device AI." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Keepsake — your own private photo library" />
    <meta name="twitter:description" content="Your memories stay yours. A private, self-hosted photo library with on-device AI." />
    <meta name="twitter:image" content="/og-image.png" />
    <title>Keepsake</title>
    <style>
      /* First-paint splash shown until React mounts and replaces #root.
         Self-contained so it renders before app CSS/JS load. */
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f7f4ef;
        color: #1a1a1a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .app-splash-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
      }
      .app-splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(30, 106, 225, 0.15);
        border-top-color: #1e6ae1;
        animation: app-splash-spin 0.8s linear infinite;
      }
      .app-splash-name {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      @keyframes app-splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        .app-splash { background: #0c0c0e; color: #f4f4f6; }
        .app-splash-ring { border-color: rgba(77, 162, 255, 0.2); border-top-color: #4da2ff; }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-ring { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <script src="/env.js"></script>
    <div id="root">
      <div class="app-splash">
        <span class="app-splash-mark">
          <svg width="52" height="52" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="splash-badge" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3b82f6" />
                <stop offset="1" stop-color="#1450c0" />
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="15" fill="url(#splash-badge)" />
            <rect x="21" y="15" width="26" height="26" rx="6" fill="#ffffff" opacity="0.32" transform="rotate(9 34 28)" />
            <rect x="16" y="18" width="32" height="32" rx="6" fill="#ffffff" />
            <path d="M32 41c-6-4.5-10.5-8-10.5-12 0-2.7 2-4.5 4.3-4.5 2.1 0 4.1 1.3 6.2 3.9 2.1-2.6 4.1-3.9 6.2-3.9 2.3 0 4.3 1.8 4.3 4.5 0 4-4.5 7.5-10.5 12z" fill="#1e6ae1" />
          </svg>
          <span class="app-splash-ring"></span>
        </span>
        <span class="app-splash-name">Keepsake</span>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
