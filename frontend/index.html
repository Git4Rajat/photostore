<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131316" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f1ea" />
    <meta name="description" content="Keepsake — your own private photo library. Your memories stay yours." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keepsake" />
    <meta property="og:title" content="Keepsake — your own private photo library" />
    <meta property="og:description" content="Your memories stay yours. A private, self-hosted photo library with on-device AI." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Keepsake — your own private photo library" />
    <meta name="twitter:description" content="Your memories stay yours. A private, self-hosted photo library with on-device AI." />
    <meta name="twitter:image" content="/og-image.png" />
    <title>Keepsake</title>
    <style>
      /* First-paint splash shown until React mounts and replaces #root.
         Self-contained so it renders before app CSS/JS load. */
      .app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f5f1ea;
        color: #1d1a16;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .app-splash-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
      }
      .app-splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(47, 93, 130, 0.12);
        border-top-color: #2f5d82;
        animation: app-splash-spin 0.8s linear infinite;
      }
      .app-splash-badge {
        display: grid;
        place-items: center;
        width: 48px;
        height: 48px;
        border-radius: 15px;
        background: #2f5d82;
        color: #ffffff;
      }
      .app-splash-name {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      @keyframes app-splash-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        .app-splash { background: #131316; color: #ede7da; }
        .app-splash-ring { border-color: rgba(122, 174, 211, 0.16); border-top-color: #7aaed3; }
        .app-splash-badge { background: #7aaed3; color: #0c1924; }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-ring { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 40px 20px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
        <p style="font-size: 18px; font-weight: 700; margin: 0 0 8px;">Keepsake needs JavaScript</p>
        <p style="margin: 0; color: #6a6a6a;">Please enable JavaScript in your browser to open your photo library.</p>
      </div>
    </noscript>
    <script src="/env.js"></script>
    <script src="/core-warmup.js?v=1" async></script>
    <div id="root">
      <div class="app-splash">
        <span class="app-splash-mark">
          <span class="app-splash-badge" aria-hidden="true">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="currentColor"><path d="M12 19.5s-7-4.3-7-9.4A3.9 3.9 0 0 1 12 7.8a3.9 3.9 0 0 1 7 2.3c0 5.1-7 9.4-7 9.4z" /></svg>
          </span>
          <span class="app-splash-ring"></span>
        </span>
        <span class="app-splash-name">Keepsake</span>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
