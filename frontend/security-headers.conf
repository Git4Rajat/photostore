# Shared security headers, included in every `location` block below.
# nginx's add_header does NOT inherit into a location that defines its own
# add_header (e.g. the Cache-Control rules elsewhere in this file), so this
# must be `include`d explicitly per-location rather than set once at the
# `server` level.
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
