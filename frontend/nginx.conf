server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The base nginx:alpine image ships with gzip off by default (the stock
    # main nginx.conf only #comments out `gzip on`, and this file replaces
    # just the conf.d server block, never that main config) -- confirmed live
    # 2026-09-29: forenkla-qa-frontend served vendor-CxbeA4mW.js's full
    # 1.39MB uncompressed despite the request sending `Accept-Encoding: gzip,
    # br` (no Content-Encoding header on the response at all). Compressible
    # text assets shrink ~70% under gzip (that same file is 378KB gzipped),
    # so every page load was paying for roughly 3.5x more bytes than
    # necessary on the app's own critical-path JS/CSS. gzip is a valid
    # directive in this server{} context, no need to touch the base image's
    # main http{} config.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

    types {
        text/html html htm;
        application/javascript js mjs;
        application/wasm wasm;
        text/css css;
        application/json json;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/png png;
        image/x-icon ico;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        image/avif avif;
    }

    location = /health {
        access_log off;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # env.js is regenerated fresh at every container start (docker-entrypoint.sh)
    # under this SAME fixed filename -- unlike the hashed build assets below, its
    # whole purpose is to change without its URL changing. It was falling
    # through to the generic *.js rule below (a 1-year immutable cache),
    # meaning a browser that had ever loaded it kept using a stale
    # window.__APP_CONFIG__ (e.g. an old model URL after a swap/rename)
    # indefinitely, surviving even a hard refresh in some browsers' handling of
    # `immutable`. Exact match (=) takes precedence over the regex location
    # below regardless of file order, so this reliably wins.
    location = /env.js {
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Cache hashed build assets aggressively. Vite emits content-addressed
    # filenames, so long-lived caching is safe for JS/CSS/WASM chunks.
    location ~* \.(?:js|mjs|css|wasm|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        expires 1y;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Browser AI model assets are versioned by the deployed bundle and should be
    # cached aggressively after the first successful fetch.
    location ^~ /models/browser-ai/runtime/ {
        expires 30d;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ^~ /models/browser-ai/models/ {
        expires 30d;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ^~ /models/face-api/ {
        expires 30d;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ^~ /models/blazeface/ {
        expires 30d;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /models/browser-ai/manifest.json {
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # index.html references the current deploy's content-hashed JS chunks by
    # name, so it must always be fetched fresh -- same reasoning as env.js
    # above. Explicit here rather than relying on nginx's default (no
    # Cache-Control at all) heuristic behavior.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
        try_files $uri /index.html;
    }
}
