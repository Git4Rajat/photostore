# Checked-in fallback only. docker-entrypoint.sh regenerates this file at
# container start with the real backend origin baked into connect-src (same
# pattern as env.js) -- this copy is what a plain `docker build`/`docker run`
# without APP_CONFIG_API_BASE_URL falls back to, so nginx never starts with a
# missing include.
#
# Verified against the real app in a browser (Playwright + real Chrome) with
# this policy in Report-Only mode: face/OCR's WASM compile, blob-URL Worker,
# the unpkg.com + tessdata.projectnaptha.com tesseract.js CDN fetches, Google
# Fonts, and Azure Blob Storage image loads all pass clean. Re-verify the same
# way before loosening or tightening any directive here.
#
# script-src needs unpkg.com too, not just connect-src: tesseract.js v2 spins
# up its worker from a blob: URL (already allowed by worker-src), then that
# worker calls importScripts('https://unpkg.com/tesseract.js@.../worker.min.js')
# -- importScripts is governed by the parent document's script-src (blob:
# workers have no origin of their own), not connect-src, so OCR was silently
# broken in production until this was added (confirmed via a live browser
# console capture: "Failed to execute 'importScripts'... script-src" errors).
#
# connect-src also gained photon.komoot.io: PhotoGallery.tsx's client-side
# reverse-geocode fallback (geocodeWithThrottle) calls it directly and had
# simply never been added to the allowlist -- same console capture showed it
# outright blocked, not just OCR.
#
# connect-src also needs the data: scheme: once script-src let
# tesseract-core.wasm.js's importScripts through, a live capture showed IT
# blocked too -- this particular tesseract-core build embeds its wasm binary
# as a base64 data: URI and loads it via fetch(dataUri) (its
# getBinaryPromise/instantiateArrayBuffer path) rather than a same-origin/CDN
# request. connect-src gates fetch() regardless of scheme, so data: has to be
# explicitly allowed there too -- same reasoning img-src already applies for
# data: image URLs, just for fetch instead of image loads. This doesn't open
# up any actual network egress: a data: URI is inline in the script itself,
# never a real request.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://unpkg.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.blob.core.windows.net; media-src 'self' blob:; connect-src 'self' http://127.0.0.1:5001 https://*.blob.core.windows.net https://unpkg.com https://tessdata.projectnaptha.com https://photon.komoot.io data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
